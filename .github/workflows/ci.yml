name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (JDK 21)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make mvnw executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ./mvnw

      - name: Run Unit Tests with Maven Wrapper (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw clean test

      - name: Run Unit Tests with Maven Wrapper (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd clean test
