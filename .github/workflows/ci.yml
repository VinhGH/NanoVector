name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Verify & Coverage (${{ matrix.os }} - JDK 21)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make scripts executable (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./mvnw
          chmod +x setup-hooks.sh
          chmod +x .githooks/pre-commit
          chmod +x .githooks/pre-push

      - name: Check code formatting with Spotless (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw spotless:check

      - name: Check code formatting with Spotless (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd spotless:check

      - name: Build, Test, Verify & Generate JaCoCo Coverage (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw clean verify

      - name: Build, Test, Verify & Generate JaCoCo Coverage (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd clean verify

      - name: Upload JaCoCo Coverage Report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: nanovector-core/target/site/jacoco/
          retention-days: 14
